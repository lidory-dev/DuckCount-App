#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 8.13.2 was tested up to compileSdk 36.1, and the gobley pin keeps us on it (see the version
# catalog). It builds against 37 all the same; this only silences the warning, for 37.0 alone.
android.suppressUnsupportedCompileSdk=37.0
# Gobley (Rust interoperability)
kotlin.mpp.enableCInteropCommonization=true