AntiFeatures:
  NonFreeNet:
    en-US: On a phone with no UnifiedPush distributor installed, push notifications
      go through Google's Firebase Cloud Messaging, if Google Play Services is there.
  TetheredNet:
    en-US: The app works only with the DuckCount server at api.duckcount.app, and
      has no setting to use another one.
